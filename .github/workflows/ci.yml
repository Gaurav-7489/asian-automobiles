name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Desktop + mobile browser tests
        run: npm run test:smoke -- --trace off
        env:
          CI: "true"
          PLAYWRIGHT_MOCK_REMOTE_IMAGES: "1"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
